[bar.default]
center = [ "taskbar" ]
end = [ "group:g4", "group:g1", "volume", "control-center" ]
margin_edge = 0
margin_ends = 0
padding = 1
radius = 0
shadow = false
start = [ "group:g2", "group:g3", "clock", "wallpaper" ]

    [[bar.default.capsule_group]]
    fill = "surface_container"
    id = "g1"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    fill = "surface_container"
    id = "g2"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    fill = "surface_container"
    id = "g4"
    members = [ "tray", "clipboard" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    fill = "surface_container"
    id = "g3"
    members = [ "battery", "brightness" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
enabled = false
schema_version = 1
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 957.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 854.0
    cy = 944.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[notification]
position = "bottom_right"

[osd]
background_opacity = 0.99999997764825821
hide_delay_ms = 950
position = "top_right"
position_vertical = "top_right"

[plugins]
enabled = []

[shell]
font_family = "Maple Mono NF CN"
ui_scale = 1.1000000089406967

    [shell.launcher]
    app_grid = true
    width = 640

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "centered"
    shadow = false

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "2"
    variant = "secondary"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "4"
    variant = "destructive"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    enabled = true
    glyph = "hibernate"
    label = "hibernate"
    shortcut = "6"
    variant = "outline"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "~/.local/share/wallpapers"

    [wallpaper.default]
    path = "~/.local/share/wallpapers/plasma/BytheWater/contents/images/1280x1024.jpg"

    [wallpaper.last]
    path = "~/.local/share/wallpapers/plasma/ScarletTree/contents/images_dark/wallhaven_mpy829.jpg"

    [wallpaper.monitors.DP-1]
    path = "~/.local/share/wallpapers/plasma/ScarletTree/contents/images_dark/wallhaven_mpy829.jpg"

    [wallpaper.monitors.eDP-1]
    path = "~/.local/share/wallpapers/plasma/BytheWater/contents/images/1280x1024.jpg"

[widget.brightness.actions]
scroll_down = "brightness-down 1%"
scroll_up = "brightness-up 1%"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
capsule = true
format = "{:%m-%d %H:%M %a}"

[widget.control-center]
capsule = true
glyph = "disabled-2"

[widget.media]
capsule = true
max_length = 91

[widget.network]
show_label = false

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
inactive_opacity = 0.82999999999999996
scale = 1.2
workspace_label_placement = "centered"

[widget.tray]
capsule = true
scale = 1.25

[widget.volume]
capsule = true

    [widget.volume.actions]
    scroll_down = "volume-down 1%"
    scroll_up = "volume-up 1%"

[widget.wallpaper]
capsule = true
